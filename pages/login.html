<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediFy — Access</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        background: #f5f8fe;
        color: #0f172a;
      }
      .bg-decor {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bg-decor span {
        position: absolute;
        width: 384px;
        height: 384px;
        border-radius: 50%;
        opacity: 0.1;
      }
      .bg-decor span.top {
        top: -128px;
        right: -128px;
        background: radial-gradient(circle, #2563eb, transparent);
      }
      .bg-decor span.bottom {
        bottom: -128px;
        left: -128px;
        background: radial-gradient(circle, #3b82f6, transparent);
      }
      .login-wrap {
        position: relative;
        width: 100%;
        max-width: 384px;
      }
      .login-card {
        background: #fff;
        border-radius: 16px;
        border: 1px solid #dbeafe;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        padding: 40px 32px;
        text-align: center;
      }
      .login-logo-row {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 32px;
      }
      .login-heading {
        font-size: 1.125rem;
        font-weight: 600;
        color: #1e293b;
        margin: 0 0 4px;
      }
      .login-subtext {
        font-size: 0.875rem;
        color: #64748b;
        margin: 0 0 32px;
      }
      .pin-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .pin-error {
        font-size: 0.75rem;
        color: #dc2626;
        margin: 0 0 24px;
        height: 16px;
      }
      .submit-btn {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        font-size: 0.875rem;
        border: none;
        border-radius: 999px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .submit-btn:hover {
        background: #1d4ed8;
      }
      .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pin-digit {
        width: 56px;
        height: 64px;
        border: 2px solid #bfdbfe;
        border-radius: 12px;
        background: #fff;
        font-size: 28px;
        font-weight: 700;
        color: #1e3a8a;
        text-align: center;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        caret-color: transparent;
      }
      .pin-digit:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }
      .pin-digit.filled {
        border-color: #2563eb;
        background: #eff6ff;
      }
      .login-logo {
        height: 60px;
      }
      .pin-digit.error {
        border-color: #dc2626;
        background: #fef2f2;
        animation: shake 0.35s ease;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      .switch-link {
        text-align: center;
        font-size: 0.8rem;
        color: #64748b;
        margin-top: 20px;
      }
      .switch-link a {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
      }
      .switch-link a:hover {
        text-decoration: underline;
      }
      .quick-login-block {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid #e2e9f5;
      }
      .quick-login-label {
        font-size: 0.7rem;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 12px;
      }
      .quick-login-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .quick-login-btn {
        flex: 1;
        min-width: 100px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 8px;
        border: 1.5px solid #dbeafe;
        border-radius: 10px;
        background: #f5f8fe;
        color: #1e3a8a;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
      }
      .quick-login-btn:hover {
        border-color: #93c5fd;
        background: #eff6ff;
      }
      .quick-login-btn.admin-btn {
        border-color: #fde68a;
        background: #fffbeb;
        color: #92400e;
      }
      .quick-login-btn.admin-btn:hover {
        border-color: #fcd34d;
        background: #fef3c7;
      }
    </style>
  </head>
  <body>
    <!-- Background decoration -->
    <div class="bg-decor">
      <span class="top"></span>
      <span class="bottom"></span>
    </div>

    <div class="login-wrap">
      <!-- Card -->
      <div class="login-card">
        <!-- Logo -->
        <div class="login-logo-row">
          <img src="../assets/medify-logo.svg" alt="MediFy" class="login-logo" />
        </div>

        <!-- Heading -->
        <h1 class="login-heading">Enter your PIN</h1>
        <p class="login-subtext">4-digit access PIN required to continue</p>

        <!-- PIN inputs -->
        <div class="pin-row" id="pinRow">
          <input
            class="pin-digit"
            id="p0"
            type="password"
            inputmode="numeric"
            maxlength="1"
            pattern="[0-9]"
            autocomplete="off"
          />
          <input
            class="pin-digit"
            id="p1"
            type="password"
            inputmode="numeric"
            maxlength="1"
            pattern="[0-9]"
            autocomplete="off"
          />
          <input
            class="pin-digit"
            id="p2"
            type="password"
            inputmode="numeric"
            maxlength="1"
            pattern="[0-9]"
            autocomplete="off"
          />
          <input
            class="pin-digit"
            id="p3"
            type="password"
            inputmode="numeric"
            maxlength="1"
            pattern="[0-9]"
            autocomplete="off"
          />
        </div>

        <!-- Error message -->
        <p id="pinError" class="pin-error"></p>

        <!-- Submit -->
        <button id="submitBtn" onclick="submitPin()" class="submit-btn">Continue</button>

        <p class="switch-link">
          New here? <a href="signup.html">Create an account</a>
        </p>

        <div class="quick-login-block">
          <p class="quick-login-label">Quick Login</p>
          <div class="quick-login-row">
            <button type="button" class="quick-login-btn" id="quickPatient1">
              <span>👤</span>
              Patient 1
            </button>
            <button type="button" class="quick-login-btn" id="quickPatient2">
              <span>👤</span>
              Patient 2
            </button>
            <button type="button" class="quick-login-btn admin-btn" id="quickAdmin">
              <span>🛡️</span>
              Admin
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { getStaff, setCurrentStaff } from '../js/staff.js';

      function goToDestination(fallback) {
        const dest = sessionStorage.getItem('loginRedirect') || fallback;
        sessionStorage.removeItem('loginRedirect');
        window.location.replace(dest);
      }

      document.getElementById('quickPatient1').addEventListener('click', function () {
        localStorage.setItem(
          'currentUser',
          JSON.stringify({ name: 'Patient One', phone: '9876500001', email: 'patient1@example.com', role: 'user' })
        );
        goToDestination('../index.html');
      });

      document.getElementById('quickPatient2').addEventListener('click', function () {
        localStorage.setItem(
          'currentUser',
          JSON.stringify({ name: 'Patient Two', phone: '9876500002', email: 'patient2@example.com', role: 'user' })
        );
        goToDestination('../index.html');
      });

      document.getElementById('quickAdmin').addEventListener('click', function () {
        const staff = getStaff();
        const admin = staff.find(function (s) {
          return s.role === 'admin';
        });
        if (admin) {
          setCurrentStaff({ id: admin.id, name: admin.name, email: admin.email, role: admin.role });
          window.location.replace('admin.html');
        }
      });
    </script>

    <script>
      (function () {
        // Redirect if already authenticated
        if (localStorage.getItem('currentUser')) {
          const dest = sessionStorage.getItem('loginRedirect') || '../index.html';
          sessionStorage.removeItem('loginRedirect');
          window.location.replace(dest);
        }

        const VALID_PINS = ['0000', '4321'];
        const inputs = [
          document.getElementById('p0'),
          document.getElementById('p1'),
          document.getElementById('p2'),
          document.getElementById('p3'),
        ];
        const errorEl = document.getElementById('pinError');

        // Auto-focus first digit
        inputs[0].focus();

        inputs.forEach(function (input, idx) {
          input.addEventListener('input', function (e) {
            const val = e.target.value.replace(/\D/g, '');
            e.target.value = val ? val[0] : '';

            // Clear any stale error before this keystroke's own outcome
            // (including a fresh wrong-PIN error from submitPin() below)
            // renders, so a new error isn't wiped out by its own trigger.
            clearError();

            if (val) {
              e.target.classList.add('filled');
              if (idx < 3) inputs[idx + 1].focus();
              else submitPin();
            } else {
              e.target.classList.remove('filled');
            }
          });

          input.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && !input.value && idx > 0) {
              inputs[idx - 1].value = '';
              inputs[idx - 1].classList.remove('filled');
              inputs[idx - 1].focus();
            }
          });

          input.addEventListener('paste', function (e) {
            e.preventDefault();
            const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
            pasted.split('').forEach(function (ch, i) {
              if (inputs[idx + i]) {
                inputs[idx + i].value = ch;
                inputs[idx + i].classList.add('filled');
              }
            });
            const next = Math.min(idx + pasted.length, 3);
            inputs[next].focus();
            if (pasted.length >= 4 - idx) submitPin();
          });
        });

        function clearError() {
          errorEl.textContent = '';
          inputs.forEach(function (inp) {
            inp.classList.remove('error');
          });
        }

        function showError() {
          errorEl.textContent = 'Incorrect PIN. Please try again.';
          inputs.forEach(function (inp) {
            inp.classList.add('error');
            inp.classList.remove('filled');
          });
          setTimeout(function () {
            inputs.forEach(function (inp) {
              inp.value = '';
              inp.classList.remove('error');
            });
            inputs[0].focus();
          }, 900);
        }

        window.submitPin = function () {
          const pin = inputs
            .map(function (inp) {
              return inp.value;
            })
            .join('');
          if (pin.length < 4) return;

          if (VALID_PINS.includes(pin)) {
            localStorage.setItem('currentUser', JSON.stringify({ name: 'MediFy User', role: 'user' }));
            const dest = sessionStorage.getItem('loginRedirect') || '../index.html';
            sessionStorage.removeItem('loginRedirect');
            window.location.replace(dest);
          } else {
            showError();
          }
        };
      })();
    </script>
  </body>
</html>
