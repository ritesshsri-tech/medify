<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Confirmed — MediFy</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f5f8fe;
        color: #0f172a;
      }
      .card {
        background: #fff;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        box-shadow:
          0 1px 4px rgba(37, 99, 235, 0.07),
          0 2px 8px rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>
  <body>
    <script>
      if (localStorage.getItem('siteUnlocked') !== '1') {
        sessionStorage.setItem('loginRedirect', window.location.href);
        window.location.replace('login.html');
      } else if (!localStorage.getItem('currentUser')) {
        sessionStorage.setItem('loginRedirect', window.location.href);
        sessionStorage.setItem('openSignIn', '1');
        window.location.replace('../index.html');
      }
    </script>
    <div id="appHeader"></div>

    <div class="max-w-lg mx-auto px-4 py-10">
      <div id="notFound" class="hidden card text-center py-16 px-6">
        <p class="text-slate-600 font-medium mb-4">Order not found</p>
        <a href="category.html" class="inline-block px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-full transition-colors">
          Browse Medicines
        </a>
      </div>

      <div id="confirmContent" class="hidden card text-center py-10 px-6">
        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-green-50 border border-green-200 flex items-center justify-center">
          <svg width="30" height="30" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12" />
          </svg>
        </div>
        <h1 class="text-lg font-800 text-slate-900 mb-1">Order Placed Successfully</h1>
        <p class="text-sm text-slate-500 mb-6">We've received your order and it's being prepared.</p>

        <div class="bg-blue-50 border border-blue-100 rounded-xl p-4 text-left space-y-2 mb-6">
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">Order ID</span>
            <span id="cfOrderId" class="font-700 text-slate-900"></span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">Amount Paid</span>
            <span id="cfTotal" class="font-700 text-slate-900"></span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">Payment Method</span>
            <span id="cfPayment" class="font-700 text-slate-900"></span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">Delivering To</span>
            <span id="cfAddress" class="font-700 text-slate-900 text-right"></span>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
          <a id="trackLink" href="#" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-full transition-colors">
            Track Order
          </a>
          <a href="category.html" class="flex-1 py-2.5 border border-blue-200 text-blue-700 hover:bg-blue-50 text-sm font-semibold rounded-full transition-colors">
            Continue Shopping
          </a>
        </div>
      </div>
    </div>

    <script src="../js/header.js"></script>
    <script type="module">
      import { getOrder } from '../js/orders.js';
      import { paise } from '../js/utils.js';

      const PAY_LABELS = { upi: 'UPI', card: 'Credit / Debit Card', netbanking: 'Net Banking', cod: 'Cash on Delivery' };

      function init() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const order = id ? getOrder(id) : null;

        if (!order) {
          document.getElementById('notFound').classList.remove('hidden');
          return;
        }

        document.getElementById('confirmContent').classList.remove('hidden');
        document.getElementById('cfOrderId').textContent = order.id;
        document.getElementById('cfTotal').textContent = paise(order.total);
        document.getElementById('cfPayment').textContent = PAY_LABELS[order.paymentMethod] || order.paymentMethod;
        document.getElementById('cfAddress').textContent = `${order.address.city}, ${order.address.state} ${order.address.pincode}`;
        document.getElementById('trackLink').href = `account.html?order=${order.id}`;
      }

      init();
    </script>
    <script src="../js/chatbot.js"></script>
    <script src="../js/demoWatermark.js"></script>
  </body>
</html>
