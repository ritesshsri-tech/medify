<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders — MediFy</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f5f8fe;
        color: #0f172a;
      }
      .card {
        background: #fff;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        box-shadow:
          0 1px 4px rgba(37, 99, 235, 0.07),
          0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .track-step {
        display: flex;
        align-items: center;
        flex: 1;
      }
      .track-dot {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        background: #e2e8f0;
        color: #94a3b8;
        border: 2px solid #e2e8f0;
      }
      .track-dot.done {
        background: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }
      .track-line {
        flex: 1;
        height: 2px;
        background: #e2e8f0;
      }
      .track-line.done {
        background: #2563eb;
      }
      .track-label {
        font-size: 10px;
        color: #94a3b8;
        text-align: center;
        margin-top: 4px;
      }
      .track-label.done {
        color: #1d4ed8;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <script>
      if (!localStorage.getItem('currentUser')) {
        sessionStorage.setItem('loginRedirect', window.location.href);
        window.location.replace('login.html');
      }
    </script>
    <div id="appHeader"></div>

    <div class="max-w-3xl mx-auto px-4 py-6">
      <h1 class="text-xl lg:text-2xl font-800 text-slate-900 mb-5">My Orders</h1>

      <div id="emptyState" class="hidden card text-center py-16">
        <p class="text-slate-600 font-medium mb-4">You haven't placed any orders yet</p>
        <a href="category.html" class="inline-block px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-full transition-colors">
          Browse Medicines
        </a>
      </div>

      <div id="orderList" class="space-y-4"></div>
    </div>

    <script src="../js/header.js"></script>
    <script type="module">
      import { getOrders, trackingStages, currentStage } from '../js/orders.js';
      import { paise } from '../js/utils.js';

      const STAGE_LABELS = {
        placed: 'Order Placed',
        packed: 'Packed',
        shipped: 'Shipped',
        out_for_delivery: 'Out for Delivery',
        delivered: 'Delivered',
      };

      function init() {
        const orders = getOrders();
        if (orders.length === 0) {
          document.getElementById('emptyState').classList.remove('hidden');
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const highlightId = params.get('order');

        document.getElementById('orderList').innerHTML = orders.map((o) => renderOrder(o, o.id === highlightId)).join('');
      }

      function renderOrder(order, expanded) {
        const stage = currentStage(order);
        const stages = trackingStages();
        const stageIdx = stages.indexOf(stage);
        const placedDate = new Date(order.placedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });

        return `
<div class="card p-5">
  <div class="flex items-start justify-between gap-3 flex-wrap mb-1">
    <div>
      <p class="font-700 text-slate-900 text-sm">${order.id}</p>
      <p class="text-xs text-slate-500">Placed on ${placedDate} &middot; ${order.items.length} item${order.items.length > 1 ? 's' : ''}</p>
    </div>
    <span class="text-sm font-700 text-slate-900">${paise(order.total)}</span>
  </div>

  <div class="flex flex-wrap gap-1 mt-3 mb-4">
    ${order.items
      .map((i) => `<span class="text-xs bg-blue-50 text-blue-700 px-2 py-1 rounded-full">${i.brandName} &times;${i.qty}</span>`)
      .join('')}
  </div>

  <!-- Tracking -->
  <div class="flex items-start pt-2">
    ${stages
      .map((s, i) => {
        const done = i <= stageIdx;
        const dotContent = done
          ? `<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`
          : i + 1;
        const line = i < stages.length - 1 ? `<span class="track-line ${i < stageIdx ? 'done' : ''}"></span>` : '';
        return `
<div class="flex-1 flex flex-col items-center">
  <div class="flex items-center w-full">
    <span class="track-dot ${done ? 'done' : ''}">${dotContent}</span>
    ${line}
  </div>
  <span class="track-label ${done ? 'done' : ''}">${STAGE_LABELS[s]}</span>
</div>`;
      })
      .join('')}
  </div>

  <div class="border-t border-blue-50 mt-4 pt-3 text-xs text-slate-500">
    Delivering to ${order.address.name}, ${order.address.line1}, ${order.address.city}, ${order.address.state} ${order.address.pincode}
  </div>
</div>`;
      }

      init();
    </script>
  </body>
</html>
