<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Prescription — MediFy</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f5f8fe;
        color: #0f172a;
      }
      .card {
        background: #fff;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        box-shadow:
          0 1px 4px rgba(37, 99, 235, 0.07),
          0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .rx-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #bfdbfe;
        border-radius: 10px;
        padding: 12px 14px;
      }
    </style>
  </head>
  <body>
    <script>
      if (localStorage.getItem('siteUnlocked') !== '1') {
        sessionStorage.setItem('loginRedirect', window.location.href);
        window.location.replace('login.html');
      } else if (!localStorage.getItem('currentUser')) {
        sessionStorage.setItem('loginRedirect', window.location.href);
        sessionStorage.setItem('openSignIn', '1');
        window.location.replace('../index.html');
      }
    </script>
    <div id="appHeader"></div>

    <div class="max-w-2xl mx-auto px-4 py-6">
      <h1 class="text-xl lg:text-2xl font-800 text-slate-900 mb-1">Upload Prescription</h1>
      <p class="text-sm text-slate-500 mb-6">Upload a new prescription or reuse one you've already saved. Once you're done, we'll help you find the right medicine.</p>

      <!-- Existing prescriptions -->
      <div class="card p-5 mb-4">
        <h2 class="text-sm font-700 text-slate-500 uppercase tracking-wider mb-3">Your Saved Prescriptions</h2>
        <div id="rxList" class="space-y-2"></div>
        <p id="rxEmpty" class="hidden text-sm text-slate-500 text-center py-6">No prescriptions uploaded yet</p>
      </div>

      <!-- Upload new -->
      <div class="card p-5">
        <h2 class="text-sm font-700 text-slate-500 uppercase tracking-wider mb-3">Upload New Prescription</h2>
        <label
          id="rxDropZone"
          class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-blue-200 rounded-xl py-10 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors"
        >
          <svg width="28" height="28" fill="none" stroke="#2563EB" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span class="text-sm text-slate-600 font-medium">Click to upload or drag file here</span>
          <span class="text-xs text-slate-400">JPG, PNG or PDF, up to 5MB</span>
          <input id="rxFileInput" type="file" accept="image/*,.pdf" class="hidden" onchange="window.onRxFileSelected(event)" />
        </label>
        <div id="rxFilePreview" class="hidden mt-3 flex items-center gap-2 text-sm text-slate-700 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2">
          <svg width="16" height="16" fill="none" stroke="#16A34A" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          <span id="rxFileName" class="truncate flex-1"></span>
        </div>
        <button
          type="button"
          id="rxSubmitBtn"
          onclick="window.submitRxUpload()"
          disabled
          class="w-full mt-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold rounded-full text-sm transition-colors"
        >
          Confirm Upload
        </button>
      </div>
    </div>

    <script src="../js/header.js"></script>
    <script type="module">
      import { getPrescriptions, addPrescription, removePrescription } from '../js/prescriptions.js';

      let rxSelectedFileName = null;

      function render() {
        const list = getPrescriptions();
        document.getElementById('rxEmpty').classList.toggle('hidden', list.length > 0);
        document.getElementById('rxList').innerHTML = list
          .map(
            (rx) => `
<div class="rx-item">
  <svg width="18" height="18" fill="none" stroke="#2563EB" stroke-width="2" viewBox="0 0 24 24" class="flex-shrink-0"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
  <div class="min-w-0 flex-1">
    <p class="text-sm font-medium text-slate-800 truncate">${rx.fileName}</p>
    <p class="text-xs text-slate-500">${new Date(rx.uploadedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</p>
  </div>
  <button type="button" onclick="window.useExistingRx('${rx.id}')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-full transition-colors flex-shrink-0">
    Use This
  </button>
  <button type="button" onclick="window.deleteRx('${rx.id}')" aria-label="Remove prescription" class="text-slate-400 hover:text-red-500 p-1 flex-shrink-0">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
  </button>
</div>`
          )
          .join('');
      }

      window.deleteRx = function (id) {
        removePrescription(id);
        render();
      };

      // Selecting an existing Rx is enough — go straight to medicine selection.
      window.useExistingRx = function (id) {
        window.location.href = 'category.html?rx=1';
      };

      window.onRxFileSelected = function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        rxSelectedFileName = file.name;
        document.getElementById('rxFileName').textContent = file.name;
        document.getElementById('rxFilePreview').classList.remove('hidden');
        document.getElementById('rxSubmitBtn').disabled = false;
      };

      window.submitRxUpload = function () {
        if (!rxSelectedFileName) return;
        addPrescription({ fileName: rxSelectedFileName, forMedicineId: null, forMedicineName: null });
        // New Rx uploaded — take them to medicine selection (existing function) to pick medicines.
        window.location.href = 'category.html?rx=1';
      };

      render();
    </script>
  </body>
</html>
