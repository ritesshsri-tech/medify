<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart — MediFy</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f5f8fe;
        color: #0f172a;
      }
      .card {
        background: #fff;
        border: 1px solid #bfdbfe;
        border-radius: 12px;
        box-shadow:
          0 1px 4px rgba(37, 99, 235, 0.07),
          0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .rx-badge {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        padding: 2px 8px;
        background: #fff1f2;
        color: #be123c;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid #fecdd3;
        white-space: nowrap;
      }
      .otc-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        background: #e7f6ec;
        color: #166534;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid #bbf7d0;
      }
      .rx-ok-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        background: #eff6ff;
        color: #1d4ed8;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid #bfdbfe;
      }
      .qty-btn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2563eb;
        font-weight: 700;
        transition: background 0.15s;
      }
      .qty-btn:hover {
        background: #eff6ff;
      }
    </style>
  </head>
  <body>
    <script>
      if (!localStorage.getItem('currentUser')) {
        sessionStorage.setItem('loginRedirect', window.location.href);
        window.location.replace('login.html');
      }
    </script>
    <div id="appHeader"></div>

    <div class="max-w-5xl mx-auto px-4 py-6">
      <h1 class="text-xl lg:text-2xl font-800 text-slate-900 mb-5">Your Cart</h1>

      <!-- Empty state -->
      <div id="emptyState" class="hidden card text-center py-16">
        <svg class="mx-auto text-blue-200 mb-3" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <p class="text-slate-600 font-medium mb-4">Your cart is empty</p>
        <a href="category.html" class="inline-block px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-full transition-colors">
          Browse Medicines
        </a>
      </div>

      <!-- Cart content -->
      <div id="cartContent" class="hidden flex flex-col lg:flex-row gap-6 items-start">
        <!-- Items list -->
        <div class="flex-1 min-w-0 w-full space-y-3">
          <!-- Rx notice banner -->
          <div id="rxNotice" class="hidden card p-4 border-amber-200 bg-amber-50 flex items-start gap-3">
            <svg class="flex-shrink-0 mt-0.5" width="18" height="18" fill="none" stroke="#B45309" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
            </svg>
            <p class="text-sm text-amber-900">
              One or more items in your cart require a prescription. Please upload a valid Rx for each marked item before checkout.
            </p>
          </div>

          <div id="cartItems" class="space-y-3"></div>
        </div>

        <!-- Summary sidebar -->
        <aside class="w-full lg:w-80 flex-shrink-0 lg:sticky top-24">
          <div class="card p-5">
            <h2 class="text-sm font-700 text-slate-500 uppercase tracking-wider mb-4">Order Summary</h2>
            <div class="space-y-2 text-sm mb-4">
              <div class="flex justify-between text-slate-600">
                <span>Items MRP</span>
                <span id="sumMrp"></span>
              </div>
              <div class="flex justify-between text-green-700 font-medium">
                <span>Discount</span>
                <span id="sumDiscount"></span>
              </div>
              <div class="flex justify-between text-slate-600">
                <span>Delivery</span>
                <span class="text-green-700 font-medium">FREE</span>
              </div>
            </div>
            <div class="border-t border-blue-100 pt-3 flex justify-between items-center mb-5">
              <span class="font-700 text-slate-900">Total</span>
              <span id="sumTotal" class="text-lg font-800 text-slate-900"></span>
            </div>
            <button
              type="button"
              id="checkoutBtn"
              onclick="window.goToCheckout()"
              class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-full text-sm transition-colors"
            >
              Proceed to Checkout
            </button>
            <p id="checkoutBlockedMsg" class="hidden text-xs text-amber-700 mt-2 text-center">
              Upload prescription for Rx items to continue
            </p>
          </div>
        </aside>
      </div>
    </div>

    <!-- Rx upload modal -->
    <div id="rxModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true">
      <div class="absolute inset-0 bg-black/50" onclick="window.closeRxModal()"></div>
      <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-bold text-slate-900 text-base">Upload Prescription</h2>
          <button type="button" onclick="window.closeRxModal()" aria-label="Close" class="text-slate-500 hover:text-slate-700 p-1">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <p id="rxModalMedName" class="text-sm text-slate-600 mb-4"></p>
        <label
          id="rxDropZone"
          class="flex flex-col items-center justify-center gap-2 border-2 border-dashed border-blue-200 rounded-xl py-10 cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors"
        >
          <svg width="28" height="28" fill="none" stroke="#2563EB" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
          </svg>
          <span class="text-sm text-slate-600 font-medium">Click to upload or drag file here</span>
          <span class="text-xs text-slate-400">JPG, PNG or PDF, up to 5MB</span>
          <input id="rxFileInput" type="file" accept="image/*,.pdf" class="hidden" onchange="window.onRxFileSelected(event)" />
        </label>
        <div id="rxFilePreview" class="hidden mt-3 flex items-center gap-2 text-sm text-slate-700 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2">
          <svg width="16" height="16" fill="none" stroke="#16A34A" stroke-width="2.5" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          <span id="rxFileName" class="truncate flex-1"></span>
        </div>
        <button
          type="button"
          id="rxSubmitBtn"
          onclick="window.submitRxUpload()"
          disabled
          class="w-full mt-5 py-2.5 bg-blue-600 hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-semibold rounded-full text-sm transition-colors"
        >
          Confirm Upload
        </button>
      </div>
    </div>

    <script src="../js/header.js"></script>
    <script type="module">
      import { fetchMedicines } from '../js/data.js';
      import { getCart, updateQty, removeFromCart, setRxUploaded, needsRxUpload, cartTotal } from '../js/cart.js';
      import { addPrescription } from '../js/prescriptions.js';
      import { paise } from '../js/utils.js';

      let cart = [];
      let allMedicines = [];
      let rxTargetId = null;
      let rxSelectedFileName = null;

      async function init() {
        try {
          allMedicines = await fetchMedicines();
        } catch (e) {
          allMedicines = [];
        }
        render();
      }

      function render() {
        cart = getCart();
        const emptyState = document.getElementById('emptyState');
        const cartContent = document.getElementById('cartContent');

        if (cart.length === 0) {
          emptyState.classList.remove('hidden');
          cartContent.classList.add('hidden');
          return;
        }
        emptyState.classList.add('hidden');
        cartContent.classList.remove('hidden');

        document.getElementById('cartItems').innerHTML = cart.map(renderItem).join('');

        const blocked = needsRxUpload();
        document.getElementById('rxNotice').classList.toggle('hidden', !blocked);
        document.getElementById('checkoutBlockedMsg').classList.toggle('hidden', !blocked);
        document.getElementById('checkoutBtn').disabled = blocked;
        document.getElementById('checkoutBtn').classList.toggle('opacity-40', blocked);
        document.getElementById('checkoutBtn').classList.toggle('cursor-not-allowed', blocked);

        renderSummary();
      }

      function renderItem(item) {
        const img = item.image || '../assets/Medicine1.webp';
        let rxBadge = '';
        if (item.requiresPrescription) {
          rxBadge = item.rxUploaded
            ? `<span class="rx-ok-badge"><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>Rx Uploaded</span>`
            : `<span class="rx-badge"><span style="font-weight:800;">Rx</span>&thinsp;Required</span>`;
        } else {
          rxBadge = `<span class="otc-badge"><svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>OTC</span>`;
        }

        const uploadAction =
          item.requiresPrescription && !item.rxUploaded
            ? `<button type="button" onclick="window.openRxModal('${item.id}')" class="text-xs font-semibold text-blue-600 hover:underline">Upload Rx</button>`
            : '';

        return `
<div class="card p-4 flex gap-4">
  <img src="${img}" alt="${item.brandName}" class="w-16 h-16 object-contain rounded-lg border border-blue-100 bg-white p-1 flex-shrink-0" onerror="this.src='../assets/Medicine1.webp'" />
  <div class="flex-1 min-w-0">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <p class="font-semibold text-sm text-slate-900 truncate">${item.brandName}</p>
        <p class="text-xs text-slate-500">${item.form || ''} ${item.strength || ''} &middot; ${item.packSize || ''}</p>
      </div>
      <button type="button" onclick="window.removeItem('${item.id}')" aria-label="Remove" class="text-slate-400 hover:text-red-500 p-1 flex-shrink-0">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
        </svg>
      </button>
    </div>
    <div class="flex items-center gap-2 mt-2 flex-wrap">
      ${rxBadge}
      ${uploadAction}
    </div>
    <div class="flex items-center justify-between mt-3">
      <div class="flex items-center border border-blue-200 rounded-full overflow-hidden">
        <button type="button" onclick="window.changeQty('${item.id}', -1)" class="qty-btn">−</button>
        <span class="w-7 text-center text-sm font-semibold text-slate-800">${item.qty}</span>
        <button type="button" onclick="window.changeQty('${item.id}', 1)" class="qty-btn">+</button>
      </div>
      <span class="font-700 text-slate-900">${paise((item.price || 0) * item.qty)}</span>
    </div>
  </div>
</div>`;
      }

      function renderSummary() {
        const mrp = cart.reduce((s, i) => s + (i.mrp || i.price || 0) * i.qty, 0);
        const total = cartTotal();
        const discount = Math.max(0, mrp - total);
        document.getElementById('sumMrp').textContent = paise(mrp);
        document.getElementById('sumDiscount').textContent = '−' + paise(discount);
        document.getElementById('sumTotal').textContent = paise(total);
      }

      window.changeQty = function (id, delta) {
        updateQty(id, delta);
        render();
      };

      window.removeItem = function (id) {
        removeFromCart(id);
        render();
      };

      window.goToCheckout = function () {
        if (needsRxUpload()) return;
        window.location.href = 'checkout.html';
      };

      // --- Rx upload modal ---
      window.openRxModal = function (id) {
        rxTargetId = id;
        rxSelectedFileName = null;
        const med = cart.find((i) => i.id === id);
        document.getElementById('rxModalMedName').textContent = med ? `For: ${med.brandName}` : '';
        document.getElementById('rxFilePreview').classList.add('hidden');
        document.getElementById('rxFileInput').value = '';
        document.getElementById('rxSubmitBtn').disabled = true;
        document.getElementById('rxModal').classList.remove('hidden');
        document.getElementById('rxModal').classList.add('flex');
      };

      window.closeRxModal = function () {
        document.getElementById('rxModal').classList.add('hidden');
        document.getElementById('rxModal').classList.remove('flex');
      };

      window.onRxFileSelected = function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        rxSelectedFileName = file.name;
        document.getElementById('rxFileName').textContent = file.name;
        document.getElementById('rxFilePreview').classList.remove('hidden');
        document.getElementById('rxSubmitBtn').disabled = false;
      };

      window.submitRxUpload = function () {
        if (!rxTargetId || !rxSelectedFileName) return;
        const med = cart.find((i) => i.id === rxTargetId);
        addPrescription({ fileName: rxSelectedFileName, forMedicineId: rxTargetId, forMedicineName: med ? med.brandName : null });
        setRxUploaded(rxTargetId, true);
        window.closeRxModal();
        render();
      };

      init();
    </script>
  </body>
</html>
