<!--
  Button — atom reference snippet
  Copy-paste guide, not an imported module. Pick the variant markup you need
  and drop it into a page/component, swapping label/href/onclick as needed.

  Variants: primary, ghost, saffron, danger
  Sizes:    mobile (sm) uses px-5 py-2.5 text-sm (tap target ~40px + line-height clears 44px)
            desktop (md+) uses px-6 py-3 text-base

  Tap target rule: every variant keeps min-h-[44px] so mobile hit area is always
  compliant regardless of text length.
-->

<!-- Primary — main CTA (e.g. Browse Medicines, Add to Cart) -->
<button
  type="button"
  class="inline-flex items-center justify-center min-h-[44px] px-5 py-2.5 md:px-6 md:py-3 text-sm md:text-base font-semibold text-white bg-blue-600 rounded-full hover:bg-blue-700 active:bg-blue-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
>
  Primary Button
</button>

<!-- Ghost — secondary action, outlined, no fill -->
<button
  type="button"
  class="inline-flex items-center justify-center min-h-[44px] px-5 py-2.5 md:px-6 md:py-3 text-sm md:text-base font-semibold text-blue-600 bg-white border-1.5 border-blue-600 rounded-full hover:bg-blue-50 active:bg-blue-100 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
  style="border-width: 1.5px;"
>
  Ghost Button
</button>

<!-- Saffron — India-accent CTA (e.g. festive/promo banners) -->
<button
  type="button"
  class="inline-flex items-center justify-center min-h-[44px] px-5 py-2.5 md:px-6 md:py-3 text-sm md:text-base font-semibold text-white bg-orange-500 rounded-full hover:bg-orange-600 active:bg-orange-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
>
  Saffron Button
</button>

<!-- Danger — destructive action (e.g. Remove from cart, Sign out) -->
<button
  type="button"
  class="inline-flex items-center justify-center min-h-[44px] px-5 py-2.5 md:px-6 md:py-3 text-sm md:text-base font-semibold text-white bg-red-600 rounded-full hover:bg-red-700 active:bg-red-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
>
  Danger Button
</button>
