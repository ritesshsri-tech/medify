<!--
  Badge — atom reference snippet
  Copy-paste guide, not an imported module.

  Variants: primary, success, amber, danger
  Font-size and padding scale per breakpoint so badges stay legible on mobile
  without overwhelming compact card layouts on desktop.
-->

<!-- Primary — informational (e.g. category tag) -->
<span class="inline-flex items-center px-2.5 py-1 md:px-3 md:py-1 text-[11px] md:text-xs font-semibold text-blue-700 bg-blue-100 rounded-full">
  Primary
</span>

<!-- Success — positive status (e.g. In Stock) -->
<span class="inline-flex items-center px-2.5 py-1 md:px-3 md:py-1 text-[11px] md:text-xs font-semibold text-green-700 bg-green-100 rounded-full">
  Success
</span>

<!-- Amber — warning status (e.g. Low Stock, Prescription Required) -->
<span class="inline-flex items-center px-2.5 py-1 md:px-3 md:py-1 text-[11px] md:text-xs font-semibold text-amber-700 bg-amber-100 rounded-full">
  Amber
</span>

<!-- Danger — negative status (e.g. Out of Stock) -->
<span class="inline-flex items-center px-2.5 py-1 md:px-3 md:py-1 text-[11px] md:text-xs font-semibold text-red-700 bg-red-100 rounded-full">
  Danger
</span>
