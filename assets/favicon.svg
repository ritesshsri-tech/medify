<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="fg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="#EAF1FE"/>

  <!-- Medical cross -->
  <rect x="26" y="8" width="12" height="48" rx="4" fill="url(#fg1)"/>
  <rect x="8" y="26" width="48" height="12" rx="4" fill="url(#fg1)"/>

  <!-- Network lines -->
  <line x1="32" y1="32" x2="13" y2="13" stroke="#14B8A6" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="32" x2="51" y2="13" stroke="#14B8A6" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="32" x2="13" y2="51" stroke="#14B8A6" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="32" x2="51" y2="51" stroke="#14B8A6" stroke-width="2" opacity="0.6"/>

  <!-- Centre node -->
  <circle cx="32" cy="32" r="5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="3.5" fill="url(#fg2)"/>

  <!-- Corner nodes -->
  <circle cx="13" cy="13" r="3" fill="url(#fg2)"/>
  <circle cx="51" cy="13" r="3" fill="url(#fg2)"/>
  <circle cx="13" cy="51" r="3" fill="url(#fg2)"/>
  <circle cx="51" cy="51" r="3" fill="url(#fg2)"/>
</svg>
